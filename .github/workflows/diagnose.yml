name: Диагностика KV без публикации

on:
  push:
    branches: [codex/restore-reliable-service]
    paths: [.github/workflows/diagnose.yml, scripts/diagnose-kv.ts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-kv:
    if: github.repository == 'baran110/BusMogilevMinsk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Прочитать manifest и снимки
        run: pnpm exec tsx scripts/diagnose-kv.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
