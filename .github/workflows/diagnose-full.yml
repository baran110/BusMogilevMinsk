name: Полная проверка 30 дней без публикации

on:
  push:
    branches: [codex/restore-reliable-service]
    paths: [.github/workflows/diagnose-full.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-diagnostics
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Собрать 30 дней только в локальный файл runner
        timeout-minutes: 8
        env:
          SOURCE_IDS: atlas,avtoslava,minsk-express,vitexpress,grandexpress,new-line,bzd
          DEBUG_SOURCE_SCHEMA: '1'
        run: pnpm collect:sample
