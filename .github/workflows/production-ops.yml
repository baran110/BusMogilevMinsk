name: Приёмка ближней БЖД после исправления KV

on:
  push:
    branches: [codex/restore-reliable-service]
    paths: [.github/workflows/production-ops.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: approved-recovery-operations
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'baran110/BusMogilevMinsk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1f0cda3362a48459bb67a60b94dd2021d418faf0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Проверить фактическое состояние старого сценария
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root = 'https://api.github.com/repos/baran110/BusMogilevMinsk';
          const headers = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
          const main = await (await fetch(`${root}/git/ref/heads/main`, {headers})).json();
          if (main.object?.sha !== '1f0cda3362a48459bb67a60b94dd2021d418faf0') throw new Error('Main changed; stop recovery');
          const run = await (await fetch(`${root}/actions/runs/38901133829`, {headers})).json();
          const workflow = await (await fetch(`${root}/actions/workflows/collect.yml`, {headers})).json();
          console.log(JSON.stringify({legacyRunStatus:run.status,legacyRunConclusion:run.conclusion,legacyRunTitle:run.display_title,workflowState:workflow.state,schedulerTokenConfigured:!!process.env.SCHEDULER_GITHUB_TOKEN}));
          JS
      - run: pnpm exec playwright install --with-deps chromium
      - name: Опубликовать реальные предложения проверенным collector
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: node --import tsx scripts/collect.ts --near
      - name: Проверить открытый health и закрытый API на обоих адресах
        run: |
          node --input-type=module <<'JS'
          for (const host of ['https://bus-mogilev-minsk.pages.dev','https://mm-routes-mirror.vojtenkoa695.workers.dev']) {
            const health = await fetch(`${host}/api/health`, {cache:'no-store',signal:AbortSignal.timeout(25000)});
            const body = await health.json();
            const denied = await fetch(`${host}/api/trips?direction=mogilev-minsk&date=2026-10-16`, {cache:'no-store',signal:AbortSignal.timeout(25000)});
            console.log(JSON.stringify({host, healthStatus:health.status, health:body, unauthenticatedStatus:denied.status}));
            if (health.status !== 200 || body.healthy !== true || denied.status !== 401) throw new Error('Production API verification failed');
            const bzd=await fetch(`${host}/api/health?source=bzd`,{cache:'no-store',signal:AbortSignal.timeout(25000)});
            const bzdBody=await bzd.json();
            console.log(JSON.stringify({host,bzdNearStatus:bzd.status,bzd:bzdBody}));
            if(bzd.status!==200||bzdBody.healthy!==true)throw new Error('Near BZD is not confirmed');
          }
          JS
      - name: Проверить свежий запуск штатного collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const root='https://api.github.com/repos/baran110/BusMogilevMinsk';
          const response=await fetch(`${root}/actions/workflows/collect.yml/dispatches`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({ref:'main',inputs:{confirm:'publish',mode:'near',slot:String(Math.floor(Date.now()/600000))}})});
          if(response.status!==204)throw new Error(`Collector dispatch HTTP ${response.status}`);
          console.log(JSON.stringify({freshCollectorDispatch:true}));
          JS
