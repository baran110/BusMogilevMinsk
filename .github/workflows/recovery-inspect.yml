# Preserve the complete recovered BZD stages and published snapshots, 2026-11-14 22:32 Minsk.
name: Резерв перед восстановлением — только чтение

on:
  push:
    branches: [codex/recovery-2026-11-14]
    paths:
      - .github/workflows/recovery-inspect.yml
      - scripts/recovery-backup.ts
      - scripts/lib/recovery-backup.ts
      - data/recovery-backup-public.pem
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-readonly-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'baran110/BusMogilevMinsk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - name: Прочитать конфигурацию и KV, зашифровать без вывода содержимого
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          SCHEDULER_TOKEN_CONFIGURED: ${{ secrets.SCHEDULER_GITHUB_TOKEN != '' }}
        run: node --import tsx scripts/recovery-backup.ts capture
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-readonly-backup
          path: .private-recovery/cloudflare-backup.encrypted.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
