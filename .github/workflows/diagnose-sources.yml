name: Проверка БЖД и Atlas без публикации

on:
  push:
    branches: [codex/restore-reliable-service]
    paths: [.github/workflows/diagnose-sources.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Только три даты, без секретов и записи KV
        env:
          SOURCE_IDS: bzd,atlas
          DEBUG_SOURCE_SCHEMA: '1'
        run: pnpm exec tsx scripts/collect.ts --local --near
