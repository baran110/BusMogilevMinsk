name: Публикация сайта после проверки

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy.yml]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'После согласования выпуска введите production'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'production') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: approved recovery trial')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          retention-days: 3
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - name: Проверить возможность первоначальной настройки входа
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --import tsx scripts/check-access-initialization.ts
      - name: Создать десять ключей и зашифровать резерв владельца
        if: steps.access.outputs.initialize == 'true'
        run: |
          node --import tsx scripts/manage-access.ts issue 10
          node --import tsx scripts/access-envelope.ts seal
      - uses: actions/upload-artifact@v4
        if: steps.access.outputs.initialize == 'true'
        with:
          name: passenger-access-encrypted
          path: .private-access/access-bundle.encrypted.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Настроить серверные секреты на обоих адресах
        if: steps.access.outputs.initialize == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm exec wrangler secret bulk .private-access/cloudflare-secrets.json --config wrangler.worker.toml
          pnpm exec wrangler pages secret bulk .private-access/cloudflare-secrets.json --project-name bus-mogilev-minsk
      - name: Опубликовать проверенную версию Worker и Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm deploy:worker
          pnpm exec wrangler pages deploy dist --project-name bus-mogilev-minsk --branch main
  bootstrap:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Первые снимки, дальние пакеты, затем публикация всех дат
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/bootstrap-workflows.ts
