name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверить секреты Cloudflare
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Не задан CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Не задан CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Опубликовать Worker-зеркало
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm deploy:worker && exit 0
            echo "::warning::Cloudflare Worker deploy failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Опубликовать Cloudflare Pages
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm exec wrangler pages deploy dist --project-name bus-mogilev-minsk --branch main && exit 0
            echo "::warning::Cloudflare Pages deploy failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1
