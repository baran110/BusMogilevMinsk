name: Публикация сайта после проверки

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy.yml]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'После согласования выпуска введите production'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    if: >-
      github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'production') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: approved recovery trial')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          retention-days: 3
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - name: Сохранить свежий зашифрованный резерв до изменений
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          SCHEDULER_TOKEN_CONFIGURED: ${{ secrets.SCHEDULER_GITHUB_TOKEN != '' }}
        run: node --import tsx scripts/recovery-backup.ts capture
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-before-production
          path: .private-recovery/cloudflare-backup.encrypted.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Проверить сохранность существующей настройки входа
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --import tsx scripts/check-access-initialization.ts
      - name: Остановить выпуск при отсутствии существующих ключей
        if: steps.access.outputs.initialize != 'false'
        run: |
          echo "::error::Существующая настройка входа не подтверждена; ключи и секреты не изменены"
          exit 1
      - name: Опубликовать проверенную версию Worker и Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm deploy:worker
          pnpm exec wrangler pages deploy dist --project-name bus-mogilev-minsk --branch main
  bootstrap:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Первые снимки, дальние пакеты, затем публикация всех дат
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/bootstrap-workflows.ts
