name: Проверка дальнего пакета БЖД без публикации

on:
  push:
    branches: [codex/restore-reliable-service]
    paths: [.github/workflows/diagnose-bzd-batch.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Пять дальних дат в обе стороны, один запрос за раз, без KV
        timeout-minutes: 12
        env:
          DEBUG_SOURCE_SCHEMA: '1'
        run: node --import tsx scripts/collect-bzd.ts --local --far --batch=0
