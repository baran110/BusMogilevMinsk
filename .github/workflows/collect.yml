name: Обновление расписания
run-name: collect/${{ inputs.mode }}/${{ inputs.slot }}

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [near, full]
        default: near
        required: true
      slot:
        description: 'Номер десятиминутного интервала UTC; задаёт таймер'
        type: string
        required: false
      confirm:
        description: 'Для публикации в рабочий KV введите publish'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: timetable-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Отклонить просроченный запуск таймера
        env:
          SLOT: ${{ inputs.slot }}
        run: |
          if [ -n "$SLOT" ]; then
            [[ "$SLOT" =~ ^[0-9]{7,10}$ ]] || { echo "::error::Неверный слот"; exit 1; }
            age=$(( $(date +%s) - SLOT * 600 ))
            (( age >= -60 && age <= 600 )) || { echo "::error::Запуск слишком долго ожидал очередь"; exit 1; }
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm exec playwright install --with-deps chromium
      - name: Собрать и опубликовать подтверждённые рейсы
        timeout-minutes: ${{ inputs.mode == 'near' && 5 || 8 }}
        env:
          MODE: ${{ inputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          case "$MODE" in
            near) pnpm collect --near ;;
            full) pnpm collect ;;
            *) echo "::error::Неизвестный режим"; exit 1 ;;
          esac
